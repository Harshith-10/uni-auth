[package]
name = "auth-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native Rust auth client for GPUI-Kit desktop apps: reqwest + keyring + loopback OAuth"

[lints]
workspace = true

[dependencies]
auth-proto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
keyring = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
auth-core = { workspace = true }
auth-axum = { workspace = true }
auth-sqlx = { workspace = true }
axum = { workspace = true }

name: Release & Publish to crates.io

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish Crates to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Verify publishable crates compile
        run: cargo check -p uni-auth-proto -p uni-auth-core -p uni-auth-sqlx -p uni-auth-axum -p uni-auth-client -p uni-auth

      - name: Publish crates in topological dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "==> Publishing uni-auth-proto..."
          cargo publish -p uni-auth-proto
          sleep 15

          echo "==> Publishing uni-auth-core..."
          cargo publish -p uni-auth-core
          sleep 15

          echo "==> Publishing uni-auth-sqlx..."
          cargo publish -p uni-auth-sqlx
          sleep 15

          echo "==> Publishing uni-auth-axum..."
          cargo publish -p uni-auth-axum
          sleep 15

          echo "==> Publishing uni-auth-client..."
          cargo publish -p uni-auth-client
          sleep 15

          echo "==> Publishing uni-auth..."
          cargo publish -p uni-auth

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true

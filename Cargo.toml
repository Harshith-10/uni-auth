[workspace]
members = [
    "crates/uni-auth",
    "crates/uni-auth-proto",
    "crates/uni-auth-core",
    "crates/uni-auth-sqlx",
    "crates/uni-auth-axum",
    "crates/uni-auth-client",
    "examples/server",
    "examples/desktop-gpui",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
authors = ["Harshith <https://github.com/Harshith-10>"]
repository = "https://github.com/Harshith-10/uni-auth"
homepage = "https://github.com/Harshith-10/uni-auth"
documentation = "https://docs.rs/uni-auth"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
collapsible_if = "allow"
chunks_exact_to_as_chunks = "allow"
too_many_arguments = "allow"
manual_div_ceil = "allow"
manual_is_multiple_of = "allow"
unnecessary_sort_by = "allow"
large_enum_variant = "allow"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time & IDs
time = { version = "0.3", features = ["serde-human-readable", "formatting", "parsing", "macros"] }
uuid = { version = "1", features = ["v7", "serde"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Cryptography
argon2 = "0.5"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
subtle = "2"
rand = "0.8"
base64 = "0.22"
unicode-normalization = "0.1"

# HTTP / Web
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie", "typed-header"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "cookies"] }
http = "1"
url = "2"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "time", "uuid"] }

# OAuth
oauth2 = "5"

# Keyring (native client)
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Testing
tower-service = "0.3"

# Workspace crate cross-references
uni-auth = { path = "crates/uni-auth", version = "0.2.0" }
uni-auth-proto = { path = "crates/uni-auth-proto", version = "0.2.0" }
uni-auth-core = { path = "crates/uni-auth-core", version = "0.2.0" }
uni-auth-sqlx = { path = "crates/uni-auth-sqlx", version = "0.2.0" }
uni-auth-axum = { path = "crates/uni-auth-axum", version = "0.2.0" }
uni-auth-client = { path = "crates/uni-auth-client", version = "0.2.0" }
